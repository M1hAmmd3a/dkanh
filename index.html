<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قنوات تيليجرام - طولكرم بلدنا</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #17212b;
            --surface:   #1f2b37;
            --divider:   #283543;
            --accent:    #2b9af3;
            --accent-dim:#1c5e96;
            --text-1:    #ffffff;
            --text-2:    #a2b5c6;
            --text-3:    #5f7e96;
            --online:    #4dd89e;
            --avatar-bg: #2b5278;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        html { font-size: 16px; }

        body {
            font-family: 'IBM Plex Sans Arabic', 'Tahoma', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── App shell ─────────────────── */
        .app {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        /* ─── Header – exactly Telegram style ─── */
        .tg-header {
            background: var(--surface);
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 8px 0 16px;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--divider);
            /* GPU-composited shadow, no layout jank */
            box-shadow: 0 1px 0 var(--divider);
        }

        .tg-header .back-btn {
            width: 40px; height: 40px;
            border: none; background: none;
            border-radius: 50%;
            color: var(--accent);
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            /* will-change keeps button click composited */
            will-change: background;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .tg-header .back-btn:active { background: rgba(43,154,243,.12); }

        .header-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--avatar-bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .header-info { flex: 1; overflow: hidden; }
        .header-info .title {
            color: var(--text-1);
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-info .subtitle {
            color: var(--text-3);
            font-size: 0.72rem;
            margin-top: 1px;
        }

        .header-actions {
            display: flex; gap: 2px;
        }
        .icon-btn {
            width: 40px; height: 40px;
            border: none; background: none;
            border-radius: 50%;
            color: var(--accent);
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            will-change: background;
            transition: background 0.15s;
        }
        .icon-btn:active { background: rgba(43,154,243,.12); }

        /* ─── Section label ─── */
        .section-label {
            padding: 18px 16px 8px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ─── Chat list items (Telegram-exact) ─── */
        .chat-list { flex: 1; }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            /* ONLY background changes on hover – no transform, no scale */
            transition: background 0.12s;
            cursor: pointer;
            position: relative;
            text-decoration: none;
            color: inherit;
            /* Ripple needs relative */
        }

        .chat-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(43,154,243,0);
            transition: background 0.12s;
        }

        .chat-item:hover  { background: rgba(255,255,255,0.04); }
        .chat-item:active { background: rgba(43,154,243,0.08); }

        /* Separator – only between items, not after last */
        .chat-item + .chat-item::before {
            content: '';
            position: absolute;
            top: 0;
            right: 70px;
            left: 0;
            height: 1px;
            background: var(--divider);
        }

        /* Avatar */
        .avatar {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: var(--avatar-bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            /* Crisp on retina */
            image-rendering: crisp-edges;
            /* Prevent sub-pixel wobble */
            transform: translateZ(0);
        }

        .avatar.green  { background: #2e7d32; }
        .avatar.blue   { background: #1565c0; }
        .avatar.teal   { background: #00695c; }
        .avatar.orange { background: #bf360c; }

        .avatar-wrap { position: relative; flex-shrink: 0; }

        /* Text block */
        .chat-body { flex: 1; min-width: 0; }

        .chat-name {
            color: var(--text-1);
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .chat-preview {
            color: var(--text-3);
            font-size: 0.78rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            direction: ltr;
            text-align: right;
        }


        .chat-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        /* ─── Verified tick ─── */
        .verified {
            display: inline-flex;
            width: 14px; height: 14px;
            background: var(--accent);
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #fff;
            margin-inline-start: 4px;
            vertical-align: middle;
        }

        /* ─── Pinned icon ─── */
        .pin-icon {
            color: var(--text-3);
            font-size: 14px;
        }



        /* ─── Fade-in on load (single pass, no reflow) ─── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translate3d(0, 6px, 0); }
            to   { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .chat-item {
            animation: fadeUp 0.22s ease both;
        }
        .chat-item:nth-child(1) { animation-delay: 0.00s; }
        .chat-item:nth-child(2) { animation-delay: 0.04s; }
        .chat-item:nth-child(3) { animation-delay: 0.08s; }
        .chat-item:nth-child(4) { animation-delay: 0.12s; }

        /* ─── Responsive ─── */
        @media (min-width: 500px) {
            .app {
                margin: 24px auto;
                min-height: auto;
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 12px 40px rgba(0,0,0,.5);
            }
            .chat-list { min-height: 360px; }
        }
    </style>
</head>
<body>
